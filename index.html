<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>京王運行管理システム</title>
<link rel="stylesheet" href="style.css">

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

</head>
<body>

<header>
  <button id="menu-btn">≡</button>
  <h1>京王運行管理システム</h1>
  <div id="now-time">現在時刻: --:--</div>
</header>

<nav id="menu">
  <a data-target="train-list" class="active">列車一覧</a>
  <a data-target="train-add">列車追加</a>
  <a data-target="location">現在位置</a>
  <a data-target="login">ログイン</a>
  <!-- ★ JS がここに「各駅時刻表」を追加する -->
</nav>

<main>

<!-- ============================
     列車一覧
============================ -->
<section id="train-list" class="page active">
  <h2>列車一覧</h2>

  <input id="search-number" placeholder="列車番号検索">

  <table id="train-table">
    <thead>
      <tr>
        <th>番号</th><th>種別</th><th>路線</th><th>方向</th>
        <th>始発</th><th>発</th><th>終着</th><th>着</th>
        <th class="admin-only" style="display:none;">操作</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <div id="train-detail-box"></div>
</section>

<!-- ============================
     列車追加 / 編集
============================ -->
<section id="train-add" class="page">
  <h2>列車追加 / 編集</h2>

  <div class="form-row">
    <label>列車番号</label>
    <input id="add-number">
  </div>

  <div class="form-row">
    <label>種別</label>
    <select id="add-type">
      <option>各停</option>
      <option>快速</option>
      <option>区急</option>
      <option>急行</option>
      <option>特急</option>
    </select>
  </div>

  <div class="form-row">
    <label>路線</label>
    <select id="add-line">
      <option value="main">京王線</option>
      <option value="sagami">相模原線</option>
    </select>
  </div>

  <div class="form-row">
    <label>方向</label>
    <select id="add-direction">
      <option value="up">上り</option>
      <option value="down">下り</option>
    </select>
  </div>

  <div class="form-row">
    <label>行き先</label>
    <input id="add-dest">
  </div>

  <h3>停車駅</h3>
  <div id="stop-list"></div>
  <button id="btn-add-stop" class="admin-only" style="display:none;">＋ 停車駅追加</button>

  <button id="btn-save-train" class="admin-only" style="display:none;">保存</button>
</section>

<!-- ============================
     現在位置（路線図）
============================ -->
<section id="location" class="page">
  <h2>現在位置</h2>

  <div class="direction-buttons">
    <button id="btn-up">上り</button>
    <button id="btn-down">下り</button>
  </div>

  <h3>京王線</h3>
  <div id="line-main-body" class="line-body"></div>

  <h3>相模原線</h3>
  <div id="line-sagami-body" class="line-body"></div>
</section>

<!-- ============================
     各駅時刻表（★新規）
============================ -->
<section id="timetable" class="page">
  <h2>各駅時刻表</h2>

  <select id="timetable-station"></select>

  <div id="timetable-body"></div>
</section>

<!-- ============================
     ログイン
============================ -->
<section id="login" class="page">
  <h2>管理者ログイン</h2>

  <div class="form-row">
    <label>パスワード</label>
    <input id="login-password" type="password">
    <button id="toggle-pass">表示</button>
  </div>

  <button id="btn-login">ログイン</button>

  <p id="login-status"></p>

  <button id="btn-save-cloud" class="admin-only" style="display:none;">クラウド保存</button>
  <button id="btn-load-cloud">クラウド受信</button>
</section>

</main>

<script src="app.js"></script>
</body>
</html>
