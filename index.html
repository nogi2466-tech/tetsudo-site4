<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>京王線 単独列車 時刻表ビューア</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 16px;
      background: #0f172a;
      color: #e5e7eb;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 20px;
    }
    h2 {
      margin: 16px 0 8px;
      font-size: 16px;
    }
    .card {
      background: #020617;
      border-radius: 12px;
      padding: 12px;
      border: 1px solid #1f2937;
      max-width: 640px;
    }
    label {
      font-size: 12px;
      color: #9ca3af;
      display: block;
      margin-bottom: 4px;
    }
    input, button {
      font-size: 13px;
      padding: 6px 8px;
      border-radius: 8px;
      border: 1px solid #374151;
      background: #020617;
      color: #e5e7eb;
      outline: none;
    }
    input:focus {
      border-color: #22c55e;
    }
    button {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      border: none;
      cursor: pointer;
      font-weight: 600;
      color: #022c22;
    }
    button:active {
      transform: translateY(1px);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      margin-top: 8px;
    }
    th, td {
      border: 1px solid #1f2937;
      padding: 4px 6px;
      text-align: center;
      white-space: nowrap;
    }
    th {
      background: #0b1220;
      position: sticky;
      top: 0;
      z-index: 1;
    }
    .muted {
      color: #9ca3af;
      font-size: 11px;
    }
    .field-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: flex-end;
      margin-bottom: 8px;
    }
    .field {
      min-width: 200px;
    }
  </style>
</head>
<body>
  <h1>京王線 単独列車 時刻表ビューア</h1>
  <div class="muted">縦1列CSV（駅,時刻）を読み込んで表示します。</div>

  <div class="card" style="margin-top:12px;">
    <h2>CSV 読み込み</h2>
    <div class="field-row">
      <div class="field">
        <label for="csvUrlInput">CSV の URL</label>
        <input id="csvUrlInput" placeholder="https://.../single_train.csv">
      </div>
      <button id="loadBtn">読み込み</button>
    </div>
    <div id="status" class="muted">縦1列のCSV（駅,時刻）を指定してください。</div>

    <h2 style="margin-top:16px;">時刻表</h2>
    <div id="timetableArea" class="muted">まだ読み込まれていません。</div>
  </div>

  <script>
    // 縦1列CSV（駅,時刻）専用パーサー
    function parseSingleTrainCsv(text) {
      const rows = text.split(/\r?\n/).map(r => r.split(","));
      const train = { stops: {} };

      // 1行目がヘッダーっぽかったらスキップ（駅 or 駅名 が含まれる場合）
      let startIndex = 0;
      if (rows[0] && rows[0][0] && rows[0][0].includes("駅")) {
        startIndex = 1;
      }

      for (let i = startIndex; i < rows.length; i++) {
        const row = rows[i];
        if (!row || row.length < 2) continue;

        const station = (row[0] || "").trim();
        const time = (row[1] || "").trim();

        if (!station || !time) continue;
        if (time === "ﾚ" || time === "||") continue;

        train.stops[station] = time;
      }

      return train;
    }

    function renderTimetable(train) {
      const area = document.getElementById("timetableArea");
      const stations = Object.keys(train.stops);

      if (stations.length === 0) {
        area.innerHTML = `<span class="muted">有効なデータがありませんでした。</span>`;
        return;
      }

      let html = "<table><tr><th>駅</th><th>時刻</th></tr>";
      stations.forEach(st => {
        html += `<tr><td>${st}</td><td>${train.stops[st]}</td></tr>`;
      });
      html += "</table>";

      area.innerHTML = html;
    }

    document.getElementById("loadBtn").addEventListener("click", async () => {
      const url = document.getElementById("csvUrlInput").value.trim();
      const status = document.getElementById("status");
      const area = document.getElementById("timetableArea");

      if (!url) {
        status.textContent = "CSV の URL を入力してください。";
        return;
      }

      status.textContent = "読み込み中…";
      area.textContent = "";

      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error("HTTP " + res.status);
        const text = await res.text();
        const train = parseSingleTrainCsv(text);
        renderTimetable(train);
        status.textContent = "読み込み完了。";
      } catch (e) {
        console.error(e);
        status.textContent = "読み込みに失敗しました。URL と公開設定を確認してください。";
        area.textContent = "";
      }
    });

    // 開発中はここにデフォルトURLを入れておくと楽
    // document.getElementById("csvUrlInput").value = "https://.../single_train.csv";
  </script>
</body>
</html>
