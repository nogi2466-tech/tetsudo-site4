<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>京王線 単独列車 時刻表ビューア</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 16px;
      background: #0f172a;
      color: #e5e7eb;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 20px;
    }
    h2 {
      margin: 16px 0 8px;
      font-size: 16px;
    }
    .card {
      background: #020617;
      border-radius: 12px;
      padding: 12px;
      border: 1px solid #1f2937;
      max-width: 640px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      margin-top: 8px;
    }
    th, td {
      border: 1px solid #1f2937;
      padding: 4px 6px;
      text-align: center;
      white-space: nowrap;
    }
    th {
      background: #0b1220;
      position: sticky;
      top: 0;
      z-index: 1;
    }
    .muted {
      color: #9ca3af;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <h1>京王線 単独列車 時刻表ビューア</h1>
  <div class="muted">Googleスプレッドシート（縦1列CSV）を自動読み込み</div>

  <div class="card" style="margin-top:12px;">
    <h2>時刻表</h2>
    <div id="status" class="muted">読み込み中…</div>
    <div id="timetableArea" style="margin-top:8px;"></div>
  </div>

  <script>
    // ★ あなたの新しい縦1列CSVのURL（固定）
    const CSV_URL =
      "https://docs.google.com/spreadsheets/d/1EyCyghvrLeOQJcP6LINLvR95v0WOsv29oCXbPe3-L-g/export?format=csv&gid=1879850608";

    // 縦1列CSV（駅,時刻）専用パーサー
    function parseSingleTrainCsv(text) {
      const rows = text.split(/\r?\n/).map(r => r.split(","));
      const train = { stops: {} };

      // 1行目がヘッダーならスキップ
      let startIndex = 0;
      if (rows[0] && rows[0][0] && rows[0][0].includes("駅")) {
        startIndex = 1;
      }

      for (let i = startIndex; i < rows.length; i++) {
        const row = rows[i];
        if (!row || row.length < 2) continue;

        const station = (row[0] || "").trim();
        const time = (row[1] || "").trim();

        if (!station || !time) continue;
        if (time === "ﾚ" || time === "||") continue;

        train.stops[station] = time;
      }

      return train;
    }

    function renderTimetable(train) {
      const area = document.getElementById("timetableArea");
      const stations = Object.keys(train.stops);

      if (stations.length === 0) {
        area.innerHTML = `<span class="muted">有効なデータがありませんでした。</span>`;
        return;
      }

      let html = "<table><tr><th>駅</th><th>時刻</th></tr>";
      stations.forEach(st => {
        html += `<tr><td>${st}</td><td>${train.stops[st]}</td></tr>`;
      });
      html += "</table>";

      area.innerHTML = html;
    }

    // ページ読み込み時に自動でCSVを読み込む
    (async () => {
      const status = document.getElementById("status");
      try {
        const res = await fetch(CSV_URL);
        if (!res.ok) throw new Error("HTTP " + res.status);
        const text = await res.text();
        const train = parseSingleTrainCsv(text);
        renderTimetable(train);
        status.textContent = "読み込み完了。";
      } catch (e) {
        console.error(e);
        status.textContent = "読み込みに失敗しました。公開設定を確認してください。";
      }
    })();
  </script>
</body>
</html>
